<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img">
<defs>
<pattern id="g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/></pattern>
<radialGradient id="gl" cx="50%" cy="46%" r="62%"><stop offset="0%" stop-color="#00c8f0" stop-opacity=".16"/><stop offset="100%" stop-color="#00c8f0" stop-opacity="0"/></radialGradient>
</defs>
<style>
.ln{fill:none;stroke:#00c8f0;stroke-opacity:.8;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.ln2{fill:none;stroke:#00c8f0;stroke-opacity:.34;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
.w{fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
.w2{fill:none;stroke:rgba(255,255,255,.22);stroke-width:.9;stroke-linejoin:round}
.fl{fill:#00c8f0;fill-opacity:.07}
.nd{fill:#00c8f0}
.dim{fill:none;stroke:rgba(255,255,255,.26);stroke-width:.8;stroke-dasharray:3 4}
.blink{animation:bk 3.4s ease-in-out infinite}
.blink:nth-of-type(2n){animation-delay:.6s}.blink:nth-of-type(3n){animation-delay:1.2s}
@keyframes bk{0%,100%{opacity:.25}50%{opacity:1}}
.flow{stroke-dasharray:7 9;animation:fw 3.4s linear infinite}
@keyframes fw{to{stroke-dashoffset:-64}}
.float{animation:fo 9s ease-in-out infinite}
@keyframes fo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 26s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pulse{animation:pl 3.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.4}50%{opacity:1}}
</style>
<rect width="400" height="250" fill="url(#g)"/>
<rect width="400" height="250" fill="url(#gl)"/>
<g class="float">
  <!-- BIM objesi: pencere family gorunusu + parametreler -->
  <g>
    <path class="fl" d="M120 66 h150 v112 H120 Z"/><path class="ln" d="M120 66 h150 v112 H120 Z"/>
    <path class="ln" d="M128 74 h134 v96 H128 Z"/>
    <path class="ln2" d="M195 74 V170 M128 122 h134"/>
    <path class="ln2" d="M140 86 h44 v26 h-44 Z M206 86 h44 v26 h-44 Z"/>
    <path class="w2" d="M120 60 h150" stroke-dasharray="6 5"/>
  </g>
  <!-- olcu cizgileri (parametrik) -->
  <path class="dim" d="M120 196 H270"/><path class="w2" d="M120 190 V202 M270 190 V202 M195 190 V202"/>
  <path class="dim" d="M100 66 V178"/><path class="w2" d="M94 66 H106 M94 178 H106"/>
  <!-- parametre satirlari -->
  <g class="w2">
    <path d="M300 84 h56 M300 104 h56 M300 124 h56 M300 144 h40"/>
    <path d="M290 78 h6 v10 h-6 Z M290 98 h6 v10 h-6 Z M290 118 h6 v10 h-6 Z M290 138 h6 v10 h-6 Z"/>
  </g>
  <path class="ln2 flow" d="M274 112 H288"/>
  <circle class="nd blink" cx="195" cy="122" r="2.6"/><circle class="nd blink" cx="296" cy="83" r="2.4"/>
</g>
</svg>
