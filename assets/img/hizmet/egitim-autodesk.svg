<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img">
<defs>
<pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/></pattern>
<radialGradient id="gl" cx="50%" cy="46%" r="62%"><stop offset="0%" stop-color="#00c8f0" stop-opacity=".16"/><stop offset="100%" stop-color="#00c8f0" stop-opacity="0"/></radialGradient>
</defs>
<style>
.ln{fill:none;stroke:#00c8f0;stroke-opacity:.8;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.ln2{fill:none;stroke:#00c8f0;stroke-opacity:.34;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
.w{fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
.w2{fill:none;stroke:rgba(255,255,255,.22);stroke-width:.9;stroke-linejoin:round}
.fl{fill:#00c8f0;fill-opacity:.07}
.nd{fill:#00c8f0}
.dim{fill:none;stroke:rgba(255,255,255,.26);stroke-width:.8;stroke-dasharray:3 4}
.blink{animation:bk 3.4s ease-in-out infinite}
.blink:nth-of-type(2n){animation-delay:.6s}.blink:nth-of-type(3n){animation-delay:1.2s}
@keyframes bk{0%,100%{opacity:.25}50%{opacity:1}}
.flow{stroke-dasharray:7 9;animation:fw 3.4s linear infinite}
@keyframes fw{to{stroke-dashoffset:-64}}
.float{animation:fo 9s ease-in-out infinite}
@keyframes fo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 26s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pulse{animation:pl 3.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.4}50%{opacity:1}}
</style>
<rect width="640" height="360" fill="url(#g)"/>
<rect width="640" height="360" fill="url(#gl)"/>
<g class="float">
  <!-- perde / ekran -->
  <g>
    <path class="fl" d="M176 52 H464 V196 H176 Z"/><path class="ln" d="M176 52 H464 V196 H176 Z"/>
    <path class="ln2" d="M176 68 H464"/>
    <!-- ekranda izometrik bina modeli -->
    <g class="ln2">
      <path d="M290 168 L320 152 L350 168 L320 184 Z"/>
      <path d="M290 168 V132 L320 116 L350 132 V168"/>
      <path d="M320 116 V152 M290 132 L320 148 L350 132"/>
      <path d="M300 140 h12 M328 140 h12 M300 158 h12 M328 158 h12"/>
    </g>
    <path class="ln" d="M320 40 V52"/>
  </g>
  <!-- egitmen -->
  <g class="w">
    <circle cx="128" cy="120" r="11"/>
    <path d="M128 131 v30 M112 142 h32 M120 161 l-6 22 M136 161 l6 22"/>
    <path d="M144 138 L172 128"/>
  </g>
  <!-- siralar ve dizustu bilgisayarlar -->
  <g>
    <g class="w2"><path d="M196 250 H444 M186 268 H454"/></g>
    <g class="ln2">
      <path d="M214 236 h40 l6 14 h-52 Z"/><path d="M220 236 v-16 h28 v16"/>
      <path d="M292 236 h40 l6 14 h-52 Z"/><path d="M298 236 v-16 h28 v16"/>
      <path d="M370 236 h40 l6 14 h-52 Z"/><path d="M376 236 v-16 h28 v16"/>
    </g>
    <g class="w2">
      <circle cx="222" cy="292" r="12"/><circle cx="300" cy="292" r="12"/><circle cx="378" cy="292" r="12"/>
      <path d="M222 304 v14 M300 304 v14 M378 304 v14"/>
    </g>
  </g>
  <!-- egitim rozeti (mezuniyet kepi soyutlamasi) -->
  <g>
    <path class="ln" d="M496 116 l34-14 l34 14 l-34 14 Z"/>
    <path class="ln2" d="M508 122 v20 c0 10 44 10 44 0 v-20"/>
    <path class="ln2" d="M564 130 v22"/><circle class="nd blink" cx="564" cy="156" r="3"/>
  </g>
</g>
<path class="dim" d="M176 214 H464"/><path class="dim" d="M496 168 H564"/>
<circle class="nd blink" cx="320" cy="40" r="3"/><circle class="nd blink" cx="128" cy="120" r="2.6"/>
</svg>
