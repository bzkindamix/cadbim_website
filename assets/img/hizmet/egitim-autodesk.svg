<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img">
<defs>
<pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/></pattern>
<radialGradient id="gl" cx="50%" cy="46%" r="62%"><stop offset="0%" stop-color="#00c8f0" stop-opacity=".16"/><stop offset="100%" stop-color="#00c8f0" stop-opacity="0"/></radialGradient>
</defs>
<style>
.ln{fill:none;stroke:#00c8f0;stroke-opacity:.8;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.ln2{fill:none;stroke:#00c8f0;stroke-opacity:.34;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
.w{fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
.w2{fill:none;stroke:rgba(255,255,255,.22);stroke-width:.9;stroke-linejoin:round}
.fl{fill:#00c8f0;fill-opacity:.07}
.nd{fill:#00c8f0}
.dim{fill:none;stroke:rgba(255,255,255,.26);stroke-width:.8;stroke-dasharray:3 4}
.blink{animation:bk 3.4s ease-in-out infinite}
.blink:nth-of-type(2n){animation-delay:.6s}.blink:nth-of-type(3n){animation-delay:1.2s}
@keyframes bk{0%,100%{opacity:.25}50%{opacity:1}}
.flow{stroke-dasharray:7 9;animation:fw 3.4s linear infinite}
@keyframes fw{to{stroke-dashoffset:-64}}
.float{animation:fo 9s ease-in-out infinite}
@keyframes fo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 26s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pulse{animation:pl 3.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.4}50%{opacity:1}}
</style>
<rect width="640" height="360" fill="url(#g)"/>
<rect width="640" height="360" fill="url(#gl)"/>
<g class="float">
  <!-- ================= EGITIM SALONU - USTTEN PLAN ================= -->
  <g>
    <!-- duvarlar (cift cizgi) -->
    <path class="fl" d="M44 66 H396 V300 H44 Z"/>
    <path class="ln" d="M44 66 H396 V300 H44 Z"/>
    <path class="ln2" d="M52 74 H388 V292 H52 Z"/>
    <!-- kapi ve acilim yayi -->
    <path class="ln" d="M44 246 V202"/>
    <path class="ln2" d="M44 202 A44 44 0 0 1 88 246"/>
    <path class="ln" d="M44 202 L46 202"/>
    <!-- projeksiyon perdesi (ust duvar) -->
    <path class="ln" d="M150 66 H290" stroke-width="3"/>
    <path class="ln2" d="M150 74 H290 M164 84 h112"/>
    <!-- egitmen masasi -->
    <path class="ln2" d="M186 96 h68 v20 h-68 Z"/>
    <!-- katilimci siralari: 3 sira x 4 masa (masa + monitor + sandalye) -->
    <g class="ln2">
      <path d="M74 150 h56 v26 H74 Z M148 150 h56 v26 h-56 Z M236 150 h56 v26 h-56 Z M310 150 h56 v26 h-56 Z"/>
      <path d="M74 206 h56 v26 H74 Z M148 206 h56 v26 h-56 Z M236 206 h56 v26 h-56 Z M310 206 h56 v26 h-56 Z"/>
      <path d="M74 262 h56 v26 H74 Z M148 262 h56 v26 h-56 Z M236 262 h56 v26 h-56 Z M310 262 h56 v26 h-56 Z"/>
    </g>
    <!-- monitorler (masa ustu, ince dikdortgen) -->
    <g class="ln">
      <path d="M88 156 h28 v8 H88 Z M162 156 h28 v8 h-28 Z M250 156 h28 v8 h-28 Z M324 156 h28 v8 h-28 Z"/>
      <path d="M88 212 h28 v8 H88 Z M162 212 h28 v8 h-28 Z M250 212 h28 v8 h-28 Z M324 212 h28 v8 h-28 Z"/>
      <path d="M88 268 h28 v8 H88 Z M162 268 h28 v8 h-28 Z M250 268 h28 v8 h-28 Z M324 268 h28 v8 h-28 Z"/>
    </g>
    <!-- sandalyeler (plan: yay) -->
    <g class="w2">
      <path d="M88 186 a14 10 0 0 0 28 0 M162 186 a14 10 0 0 0 28 0 M250 186 a14 10 0 0 0 28 0 M324 186 a14 10 0 0 0 28 0"/>
      <path d="M88 242 a14 10 0 0 0 28 0 M162 242 a14 10 0 0 0 28 0 M250 242 a14 10 0 0 0 28 0 M324 242 a14 10 0 0 0 28 0"/>
      <path d="M88 298 a14 10 0 0 0 28 0 M162 298 a14 10 0 0 0 28 0 M250 298 a14 10 0 0 0 28 0 M324 298 a14 10 0 0 0 28 0"/>
    </g>
    <!-- kot / eksen isareti -->
    <path class="dim" d="M220 96 V300"/>
  </g>

  <!-- ================= EKRANDA IZOMETRIK MODEL ================= -->
  <g>
    <path class="ln" d="M446 78 H600 V186 H446 Z"/>
    <path class="ln2" d="M446 92 H600"/>
    <path class="ln2" d="M508 196 h30 M523 186 v10"/>
    <g class="ln2">
      <path d="M492 162 L523 146 L554 162 L523 178 Z"/>
      <path d="M492 162 V128 L523 112 L554 128 V162"/>
      <path d="M523 112 V146 M492 128 L523 144 L554 128"/>
      <path d="M502 136 h10 M534 136 h10 M502 154 h10 M534 154 h10"/>
    </g>
    <path class="ln flow" d="M446 134 H392" stroke-opacity=".5"/>
  </g>

  <!-- ================= ATC ROZETI (metinsiz) ================= -->
  <g>
    <path class="ln" d="M523 226 l30 16 v34 l-30 18 l-30-18 v-34 Z"/>
    <path class="ln2" d="M523 240 l16 9 v18 l-16 10 l-16-10 v-18 Z"/>
    <path class="ln" d="M513 268 l7 8 l16-18"/>
    <path class="ln2" d="M523 294 v14 M508 308 h30"/>
  </g>
</g>

<!-- olcu cizgileri -->
<path class="dim" d="M44 320 H396"/><path class="w2" d="M44 314 V326 M396 314 V326"/>
<path class="dim" d="M420 78 V186"/><path class="w2" d="M414 78 H426 M414 186 H426"/>
<circle class="nd blink" cx="220" cy="66" r="3"/><circle class="nd blink" cx="523" cy="112" r="2.8"/><circle class="nd blink" cx="523" cy="268" r="2.6"/>
</svg>
