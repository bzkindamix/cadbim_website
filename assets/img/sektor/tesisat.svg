<path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
</pattern>
<radialGradient id="glow" cx="50%" cy="45%" r="60%">
<stop offset="0%" stop-color="#2dd4bf" stop-opacity=".18"/>
<stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
</radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#2dd4bf" stop-opacity=".55"/>
<stop offset="100%" stop-color="#2dd4bf" stop-opacity=".08"/>
