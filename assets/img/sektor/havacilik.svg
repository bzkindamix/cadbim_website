<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img">
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
</pattern>
<radialGradient id="glow" cx="52%" cy="50%" r="60%">
<stop offset="0%" stop-color="#a5b4fc" stop-opacity=".18"/>
<stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
</radialGradient>
<linearGradient id="jet" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#00c8f0" stop-opacity=".45"/>
<stop offset="100%" stop-color="#00c8f0" stop-opacity="0"/>
</linearGradient>
</defs>
<style>
.ln{fill:none;stroke:#a5b4fc;stroke-opacity:.85;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.ln2{fill:none;stroke:#a5b4fc;stroke-opacity:.42;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
.mesh{fill:none;stroke:#a5b4fc;stroke-opacity:.22;stroke-width:.7}
.cy{fill:none;stroke:#00c8f0;stroke-opacity:.75;stroke-width:1.2;stroke-linecap:round}
.fl{fill:#a5b4fc;fill-opacity:.07}
.nd{fill:#a5b4fc}
.dim{fill:none;stroke:rgba(255,255,255,.28);stroke-width:.8;stroke-dasharray:3 4}
.tick{fill:none;stroke:rgba(255,255,255,.4);stroke-width:.9}
.blink{animation:bk 3.2s ease-in-out infinite}
.blink:nth-of-type(2n){animation-delay:.5s}
.blink:nth-of-type(3n){animation-delay:1.1s}
@keyframes bk{0%,100%{opacity:.2}50%{opacity:1}}
.scan{animation:sc 7s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sc{0%{opacity:0;transform:translateY(-40px)}12%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateY(400px)}}
.float{animation:fo 9s ease-in-out infinite}
@keyframes fo{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.stream{stroke-dasharray:9 11;animation:st 3.6s linear infinite}
@keyframes st{to{stroke-dashoffset:-80}}
.pulse{animation:pl 3s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:.95}}
.sweep{animation:sw 6s ease-in-out infinite}
@keyframes sw{0%,100%{opacity:.15}50%{opacity:.5}}
</style>
<rect width="640" height="420" fill="url(#g)"/>
<rect width="640" height="420" fill="url(#glow)"/>

<g class="float">
<!-- ========== govde (ustten gorunus, burun solda) ========== -->
<path class="fl" d="M92 210 C100 198 118 190 146 188 L468 188 C508 190 534 196 556 205 L556 215 C534 224 508 230 468 232 L146 232 C118 230 100 222 92 210 Z"/>
<path class="ln" d="M92 210 C100 198 118 190 146 188 L468 188 C508 190 534 196 556 205 L556 215 C534 224 508 230 468 232 L146 232 C118 230 100 222 92 210 Z"/>

<!-- ========== ana kanatlar (ok acili) ========== -->
<path class="fl" d="M268 190 L392 64 L436 64 L404 190 Z"/>
<path class="ln" d="M268 190 L392 64 L436 64 L404 190"/>
<path class="fl" d="M268 230 L392 356 L436 356 L404 230 Z"/>
<path class="ln" d="M268 230 L392 356 L436 356 L404 230"/>

<!-- kanat ici sonlu eleman agi (ust) -->
<g class="mesh">
<path d="M299 158 L410 158 M330 126 L416 126 M361 95 L422 95"/>
<path d="M289 168 L397 168 M310 147 L413 147 M341 116 L419 116 M372 85 L425 85"/>
<path d="M299 158 L289 168 M330 126 L310 147 M361 95 L341 116 M392 64 L372 85"/>
<path d="M410 158 L397 168 M416 126 L413 147 M422 95 L419 116 M436 64 L425 85"/>
</g>
<!-- kanat ici sonlu eleman agi (alt) -->
<g class="mesh">
<path d="M299 262 L410 262 M330 294 L416 294 M361 325 L422 325"/>
<path d="M289 252 L397 252 M310 273 L413 273 M341 304 L419 304 M372 335 L425 335"/>
<path d="M299 262 L289 252 M330 294 L310 273 M361 325 L341 304 M392 356 L372 335"/>
<path d="M410 262 L397 252 M416 294 L413 273 M422 325 L419 304 M436 356 L425 335"/>
</g>

<!-- ========== yatay dumenler ========== -->
<path class="fl" d="M470 188 L516 132 L546 132 L526 188 Z"/>
<path class="ln" d="M470 188 L516 132 L546 132 L526 188"/>
<path class="fl" d="M470 232 L516 288 L546 288 L526 232 Z"/>
<path class="ln" d="M470 232 L516 288 L546 288 L526 232"/>

<!-- dikey dumen izi -->
<path class="ln2" d="M478 204 L548 199 L556 205 M478 216 L548 221 L556 215" stroke-opacity=".55"/>

<!-- kokpit -->
<ellipse class="cy" cx="152" cy="210" rx="36" ry="13"/>
<path class="ln2" d="M126 210 h52" stroke-opacity=".4"/>

<!-- hava girisleri -->
<path class="ln2" d="M262 196 h74 a5 5 0 0 1 0 6 h-74 Z" stroke-opacity=".55"/>
<path class="ln2" d="M262 218 h74 a5 5 0 0 0 0 6 h-74 Z" stroke-opacity=".55"/>
<!-- merkez hatti + kaburga (station) hatlari -->
<path class="ln2" d="M100 210 H556" stroke-opacity=".3" stroke-dasharray="14 6 3 6"/>
<path class="ln2" d="M200 190 V230 M240 189 V231 M300 188 V232 M360 188 V232 M420 188 V232 M470 188 V232" stroke-opacity=".2"/>

<!-- motor cikislari + itki izi -->
<g>
<circle class="ln" cx="552" cy="203" r="7"/><circle class="ln" cx="552" cy="217" r="7"/>
<path class="cy pulse" d="M562 203 h42 M562 217 h42" stroke-width="2.4"/>
<rect x="560" y="196" width="52" height="14" fill="url(#jet)" opacity=".45"/>
<rect x="560" y="210" width="52" height="14" fill="url(#jet)" opacity=".45"/>
</g>
</g>

<!-- ========== akis cizgileri ========== -->
<path class="cy stream" d="M28 152 C120 150 210 140 300 126" stroke-opacity=".3"/>
<path class="cy stream" d="M28 268 C120 270 210 280 300 294" stroke-opacity=".22"/>

<!-- ========== olcu cizgileri ========== -->
<path class="dim" d="M596 64 V356"/><path class="tick" d="M588 64 H604 M588 356 H604"/>
<path class="dim" d="M92 390 H556"/><path class="tick" d="M92 382 V398 M556 382 V398"/>
<path class="dim" d="M268 190 V120"/><path class="tick" d="M264 120 h8"/>
<path class="ln2 sweep" d="M268 190 A 66 66 0 0 0 314 130" stroke-opacity=".4"/>

<circle class="nd blink" cx="152" cy="210" r="2.8"/><circle class="nd blink" cx="92" cy="210" r="3"/><circle class="nd blink" cx="414" cy="64" r="3"/><circle class="nd blink" cx="414" cy="356" r="3"/><circle class="nd blink" cx="556" cy="210" r="3"/>
<g class="scan"><line x1="60" y1="80" x2="580" y2="80" stroke="#00c8f0" stroke-opacity=".5" stroke-width="1"/></g>
</svg>
