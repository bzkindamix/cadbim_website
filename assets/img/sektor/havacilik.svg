<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img">
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
</pattern>
<radialGradient id="glow" cx="50%" cy="48%" r="60%">
<stop offset="0%" stop-color="#a5b4fc" stop-opacity=".18"/>
<stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
</radialGradient>
</defs>
<style>
.ln{fill:none;stroke:#a5b4fc;stroke-opacity:.75;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.ln2{fill:none;stroke:#a5b4fc;stroke-opacity:.32;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
.cy{fill:none;stroke:#00c8f0;stroke-opacity:.7;stroke-width:1.2;stroke-linecap:round}
.fl{fill:#a5b4fc;fill-opacity:.07}
.nd{fill:#a5b4fc}
.dim{fill:none;stroke:rgba(255,255,255,.28);stroke-width:.8;stroke-dasharray:3 4}
.blink{animation:bk 3.2s ease-in-out infinite}
.blink:nth-of-type(2n){animation-delay:.5s}
.blink:nth-of-type(3n){animation-delay:1.1s}
@keyframes bk{0%,100%{opacity:.2}50%{opacity:1}}
.scan{animation:sc 7s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sc{0%{opacity:0;transform:translateY(-40px)}12%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateY(400px)}}
.float{animation:fo 9s ease-in-out infinite}
@keyframes fo{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 1.1s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:sp 1.3s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.pulse{animation:pl 2.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.3}50%{opacity:.9}}
</style>
<rect width="640" height="420" fill="url(#g)"/>
<rect width="640" height="420" fill="url(#glow)"/>
<g class="float">
<!-- kollar: govdeden motorlara -->
<g class="ln">
<line x1="352" y1="188" x2="478" y2="112"/><line x1="288" y1="188" x2="162" y2="112"/>
<line x1="352" y1="232" x2="478" y2="308"/><line x1="288" y1="232" x2="162" y2="308"/>
</g>
<g class="ln2" stroke-opacity=".3">
<line x1="352" y1="196" x2="472" y2="126"/><line x1="288" y1="196" x2="168" y2="126"/>
<line x1="352" y1="224" x2="472" y2="294"/><line x1="288" y1="224" x2="168" y2="294"/>
</g>
<!-- gövde -->
<path class="fl" d="M296 182 L320 168 L344 182 L364 196 L364 224 L344 238 L320 252 L296 238 L276 224 L276 196 Z"/>
<path class="ln" d="M296 182 L320 168 L344 182 L364 196 L364 224 L344 238 L320 252 L296 238 L276 224 L276 196 Z"/>
<line class="cy blink" x1="296" y1="200" x2="344" y2="200" stroke-width="2"/>
<circle class="nd blink" cx="320" cy="210" r="2.6"/>
<!-- anten / GPS direği -->
<line class="ln2" x1="320" y1="168" x2="320" y2="146" stroke-opacity=".5"/>
<circle class="nd blink" cx="320" cy="142" r="3.2"/>
<circle class="cy" cx="320" cy="142" r="8" stroke-opacity=".35"/>
<!-- kamera gimbal -->
<line class="ln2" x1="320" y1="252" x2="320" y2="272" stroke-opacity=".5"/>
<path class="ln" d="M304 272 L336 272 L332 292 L308 292 Z"/>
<circle class="cy" cx="320" cy="282" r="6" stroke-opacity=".7"/>
<circle class="nd blink" cx="320" cy="282" r="2"/>
<!-- 4x motor + pervane -->
<g>
<!-- NE -->
<circle class="ln2" cx="478" cy="112" r="46" stroke-dasharray="4 5" stroke-opacity=".3"/>
<circle class="ln" cx="478" cy="112" r="11"/>
<g class="spin"><ellipse cx="478" cy="112" rx="42" ry="7" fill="#a5b4fc" fill-opacity=".16"/></g>
<g class="spinr"><ellipse cx="478" cy="112" rx="7" ry="42" fill="#a5b4fc" fill-opacity=".1"/></g>
<circle class="nd blink" cx="478" cy="112" r="2.6"/>
<!-- NW -->
<circle class="ln2" cx="162" cy="112" r="46" stroke-dasharray="4 5" stroke-opacity=".3"/>
<circle class="ln" cx="162" cy="112" r="11"/>
<g class="spinr"><ellipse cx="162" cy="112" rx="42" ry="7" fill="#a5b4fc" fill-opacity=".16"/></g>
<g class="spin"><ellipse cx="162" cy="112" rx="7" ry="42" fill="#a5b4fc" fill-opacity=".1"/></g>
<circle class="nd blink" cx="162" cy="112" r="2.6"/>
<!-- SE -->
<circle class="ln2" cx="478" cy="308" r="46" stroke-dasharray="4 5" stroke-opacity=".3"/>
<circle class="ln" cx="478" cy="308" r="11"/>
<g class="spinr"><ellipse cx="478" cy="308" rx="42" ry="7" fill="#a5b4fc" fill-opacity=".16"/></g>
<g class="spin"><ellipse cx="478" cy="308" rx="7" ry="42" fill="#a5b4fc" fill-opacity=".1"/></g>
<circle class="nd blink" cx="478" cy="308" r="2.6"/>
<!-- SW -->
<circle class="ln2" cx="162" cy="308" r="46" stroke-dasharray="4 5" stroke-opacity=".3"/>
<circle class="ln" cx="162" cy="308" r="11"/>
<g class="spin"><ellipse cx="162" cy="308" rx="42" ry="7" fill="#a5b4fc" fill-opacity=".16"/></g>
<g class="spinr"><ellipse cx="162" cy="308" rx="7" ry="42" fill="#a5b4fc" fill-opacity=".1"/></g>
<circle class="nd blink" cx="162" cy="308" r="2.6"/>
</g>
<!-- sinyal / telemetri halkalari -->
<g class="pulse"><circle class="cy" cx="320" cy="142" r="20" stroke-opacity=".25"/><circle class="cy" cx="320" cy="142" r="32" stroke-opacity=".14"/></g>
<!-- boyut cizgileri -->
<path class="dim" d="M162 66 L478 66 M162 58 V74 M478 58 V74"/>
<path class="dim" d="M112 112 V308 M104 112 H120 M104 308 H120"/>
<g><line class="dim" x1="162" y1="112" x2="478" y2="308"/><line class="dim" x1="478" y1="112" x2="162" y2="308"/><text x="336" y="216" fill="rgba(255,255,255,.4)" font-size="10" font-family="monospace" letter-spacing="1">UAV-04</text></g>
<circle class="nd blink" cx="320" cy="168" r="2.4"/><circle class="nd blink" cx="320" cy="252" r="2.4"/>
<g class="scan"><line x1="90" y1="70" x2="550" y2="70" stroke="#00c8f0" stroke-opacity=".5" stroke-width="1"/></g>
</g>
</svg>
