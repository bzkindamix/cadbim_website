<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img">
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
</pattern>
<radialGradient id="glow" cx="50%" cy="52%" r="60%">
<stop offset="0%" stop-color="#ef4444" stop-opacity=".18"/>
<stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
</radialGradient>
<linearGradient id="pack" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#00c8f0" stop-opacity=".10"/>
<stop offset="50%" stop-color="#00c8f0" stop-opacity=".26"/>
<stop offset="100%" stop-color="#00c8f0" stop-opacity=".10"/>
</linearGradient>
</defs>
<style>
.ln{fill:none;stroke:#ef4444;stroke-opacity:.75;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.ln2{fill:none;stroke:#ef4444;stroke-opacity:.32;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
.cy{fill:none;stroke:#00c8f0;stroke-opacity:.7;stroke-width:1.2;stroke-linecap:round}
.fl{fill:#ef4444;fill-opacity:.06}
.nd{fill:#ef4444}
.dim{fill:none;stroke:rgba(255,255,255,.28);stroke-width:.8;stroke-dasharray:3 4}
.tick{fill:none;stroke:rgba(255,255,255,.4);stroke-width:.9}
.blink{animation:bk 3.2s ease-in-out infinite}
.blink:nth-of-type(2n){animation-delay:.5s}
.blink:nth-of-type(3n){animation-delay:1.1s}
@keyframes bk{0%,100%{opacity:.2}50%{opacity:1}}
.scan{animation:sc 7s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sc{0%{opacity:0;transform:translateY(-40px)}12%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateY(400px)}}
.float{animation:fo 9s ease-in-out infinite}
@keyframes fo{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.flow{stroke-dasharray:10 12;animation:fw 4.5s linear infinite}
@keyframes fw{to{stroke-dashoffset:-88}}
.pulse{animation:pl 3.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.4}50%{opacity:.95}}
.roll{transform-box:fill-box;transform-origin:center;animation:rl 6s linear infinite}
@keyframes rl{to{transform:rotate(360deg)}}
</style>
<rect width="640" height="420" fill="url(#g)"/>
<rect width="640" height="420" fill="url(#glow)"/>

<!-- ========== aerodinamik akis (govdenin arkasinda) ========== -->
<path class="cy flow" d="M52 214 C130 206 196 186 262 172 C324 158 398 160 462 178 C518 194 566 212 596 226" stroke-opacity=".38"/>
<path class="cy flow" d="M52 240 C132 232 198 210 264 196 C326 182 400 184 464 200 C520 214 566 230 596 242" stroke-opacity=".2"/>

<g class="float">
<!-- ========== govde yan profili ========== -->
<path class="fl" d="M94 282 C94 268 100 254 116 250 L196 236 C214 216 236 202 258 198 C286 190 320 188 352 188 L386 188 C412 188 430 194 442 204 L470 226 L520 236 C534 238 543 246 544 258 L546 288 C546 296 542 300 534 300 L516 300 C516 262 494 250 470 250 C446 250 424 262 424 300 L226 300 C226 262 204 250 180 250 C156 250 134 262 134 300 L108 300 C99 300 94 293 94 284 Z"/>
<path class="ln" d="M94 282 C94 268 100 254 116 250 L196 236 C214 216 236 202 258 198 C286 190 320 188 352 188 L386 188 C412 188 430 194 442 204 L470 226 L520 236 C534 238 543 246 544 258 L546 288 C546 296 542 300 534 300 L516 300 C516 262 494 250 470 250 C446 250 424 262 424 300 L226 300 C226 262 204 250 180 250 C156 250 134 262 134 300 L108 300 C99 300 94 293 94 284 Z"/>

<!-- kusak (bel) hatti + cam bandi -->
<path class="ln2" d="M198 234 C300 228 430 226 522 234" stroke-opacity=".7"/>
<path class="ln2" d="M262 202 C292 194 320 192 352 192 L384 192 C408 192 426 198 438 208 L460 228 L206 230 Z" stroke-opacity=".55"/>
<path class="ln2" d="M330 230 V192" stroke-opacity=".6"/>
<path class="ln2" d="M258 198 L206 232" stroke-opacity=".45"/>

<!-- kapi ayrim cizgileri ve kapi kolu -->
<path class="ln2" d="M248 298 C252 262 256 246 262 226" stroke-opacity=".38"/>
<path class="ln2" d="M394 298 C394 268 394 250 394 230" stroke-opacity=".38"/>
<path class="ln2" d="M300 246 h20 M368 244 h20" stroke-opacity=".45"/>

<!-- kaput ve on tampon detayi -->
<path class="ln2" d="M116 250 C140 246 168 242 196 236" stroke-opacity=".3"/>
<path class="ln2" d="M96 272 L128 268" stroke-opacity=".35"/>
<path class="ln2" d="M100 288 L126 288" stroke-opacity=".3"/>
<!-- arka tampon / difuzor -->
<path class="ln2" d="M520 288 L542 288" stroke-opacity=".3"/>
<path class="ln2" d="M508 234 C524 236 536 242 542 252" stroke-opacity=".4"/>

<!-- ========== batarya paketi (EV) ========== -->
<g>
<rect x="216" y="276" width="218" height="20" rx="4" fill="url(#pack)" stroke="#00c8f0" stroke-opacity=".55" stroke-width="1.1"/>
<path class="cy" d="M244 276 V296 M272 276 V296 M300 276 V296 M328 276 V296 M356 276 V296 M384 276 V296 M412 276 V296" stroke-opacity=".3"/>
<line class="cy pulse" x1="222" y1="286" x2="428" y2="286" stroke-width="1.6"/>
</g>
<!-- sarj portu -->
<g><circle class="cy" cx="506" cy="262" r="7"/><circle class="nd blink" cx="506" cy="262" r="2.6"/><path class="cy" d="M506 255 v-9 M513 262 h9" stroke-opacity=".45"/></g>

<!-- ========== tekerlekler ========== -->
<g>
<circle class="ln" cx="180" cy="296" r="40"/><circle class="ln2" cx="180" cy="296" r="27"/>
<g class="roll"><path class="ln2" d="M180 269 V323 M153 296 H207 M161 277 L199 315 M199 277 L161 315" stroke-opacity=".22"/></g>
<circle class="ln2" cx="180" cy="296" r="8"/>
</g>
<g>
<circle class="ln" cx="470" cy="296" r="40"/><circle class="ln2" cx="470" cy="296" r="27"/>
<g class="roll"><path class="ln2" d="M470 269 V323 M443 296 H497 M451 277 L489 315 M489 277 L451 315" stroke-opacity=".22"/></g>
<circle class="ln2" cx="470" cy="296" r="8"/>
</g>
</g>

<!-- ========== zemin ve olcu cizgileri ========== -->
<path class="ln2" d="M60 337 H580" stroke-opacity=".3"/>
<path class="dim" d="M180 366 H470"/><path class="tick" d="M180 358 V374 M470 358 V374"/>
<path class="dim" d="M94 390 H546"/><path class="tick" d="M94 382 V398 M546 382 V398"/>
<path class="dim" d="M70 188 V337"/><path class="tick" d="M62 188 H78 M62 337 H78"/>

<!-- agirlik merkezi -->
<g><circle class="ln2" cx="300" cy="258" r="10" stroke-opacity=".55"/><path class="ln2" d="M300 248 v20 M290 258 h20" stroke-opacity=".55"/></g>

<circle class="nd blink" cx="196" cy="236" r="2.8"/><circle class="nd blink" cx="352" cy="188" r="2.8"/><circle class="nd blink" cx="470" cy="226" r="2.8"/><circle class="nd blink" cx="180" cy="296" r="2.8"/><circle class="nd blink" cx="470" cy="296" r="2.8"/>
<g class="scan"><line x1="70" y1="80" x2="570" y2="80" stroke="#00c8f0" stroke-opacity=".5" stroke-width="1"/></g>
</svg>
