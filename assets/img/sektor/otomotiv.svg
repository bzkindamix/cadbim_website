<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img">
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
</pattern>
<radialGradient id="glow" cx="50%" cy="48%" r="60%">
<stop offset="0%" stop-color="#ef4444" stop-opacity=".18"/>
<stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
</radialGradient>
<radialGradient id="grillglow" cx="50%" cy="50%" r="55%">
<stop offset="0%" stop-color="#00c8f0" stop-opacity=".85"/>
<stop offset="100%" stop-color="#00c8f0" stop-opacity="0"/>
</radialGradient>
</defs>
<style>
.ln{fill:none;stroke:#ef4444;stroke-opacity:.75;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.ln2{fill:none;stroke:#ef4444;stroke-opacity:.32;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
.cy{fill:none;stroke:#00c8f0;stroke-opacity:.7;stroke-width:1.2;stroke-linecap:round}
.fl{fill:#ef4444;fill-opacity:.06}
.nd{fill:#ef4444}
.dim{fill:none;stroke:rgba(255,255,255,.28);stroke-width:.8;stroke-dasharray:3 4}
.blink{animation:bk 3.2s ease-in-out infinite}
.blink:nth-of-type(2n){animation-delay:.5s}
.blink:nth-of-type(3n){animation-delay:1.1s}
@keyframes bk{0%,100%{opacity:.2}50%{opacity:1}}
.scan{animation:sc 7s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sc{0%{opacity:0;transform:translateY(-40px)}12%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateY(400px)}}
.float{animation:fo 9s ease-in-out infinite}
@keyframes fo{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.glow-pulse{animation:gp 3.4s ease-in-out infinite}
@keyframes gp{0%,100%{opacity:.45}50%{opacity:1}}
.glow-pulse2{animation:gp 3.4s ease-in-out infinite .6s}
</style>
<rect width="640" height="420" fill="url(#g)"/>
<rect width="640" height="420" fill="url(#glow)"/>
<g class="float">
<!-- govde ana hatlar: SUV/crossover onden gorunus, dik/kutulu duruş -->
<path class="fl" d="M128 322 C122 268 128 218 142 188 C150 170 164 158 182 152 L200 132 C216 116 244 106 320 106 C396 106 424 116 440 132 L458 152 C476 158 490 170 498 188 C512 218 518 268 512 322 L512 336 C512 344 505 350 497 350 L455 350 C447 350 440 344 440 336 L440 330 L200 330 L200 336 C200 344 193 350 185 350 L143 350 C135 350 128 344 128 336 Z"/>
<path class="ln" d="M128 322 C122 268 128 218 142 188 C150 170 164 158 182 152 L200 132 C216 116 244 106 320 106 C396 106 424 116 440 132 L458 152 C476 158 490 170 498 188 C512 218 518 268 512 322 L512 336 C512 344 505 350 497 350 L455 350 C447 350 440 344 440 336 L440 330 L200 330 L200 336 C200 344 193 350 185 350 L143 350 C135 350 128 344 128 336 Z"/>
<!-- ust gövde / alt tampon ayrim cizgisi (iki renk hatti) -->
<path class="ln2" d="M136 268 C210 258 430 258 504 268" stroke-opacity=".55"/>
<!-- tavan / cam hatti ipucu -->
<path class="ln2" d="M200 132 C216 116 244 106 320 106 C396 106 424 116 440 132" stroke-opacity=".5"/>
<path class="ln2" d="M214 126 C240 114 284 108 320 108 C356 108 400 114 426 126" stroke-opacity=".28"/>
<!-- kaput yuzey cizgileri -->
<path class="ln2" d="M182 152 C168 190 160 230 164 266" stroke-opacity=".3"/>
<path class="ln2" d="M458 152 C472 190 480 230 476 266" stroke-opacity=".3"/>
<path class="ln2" d="M320 118 V240" stroke-opacity=".22"/>
<!-- ince acili LED far sinyali (sol) -->
<g>
<path class="ln" d="M150 190 L206 172 L214 184 L164 206 Z"/>
<path class="cy blink" d="M156 194 L206 178" stroke-width="2.2"/>
</g>
<!-- ince acili LED far sinyali (sag) -->
<g>
<path class="ln" d="M490 190 L434 172 L426 184 L476 206 Z"/>
<path class="cy blink" d="M484 194 L434 178" stroke-width="2.2"/>
</g>
<!-- genis altigen kapali EV izgara paneli (parlayan) -->
<g>
<path class="ln" d="M226 214 L414 214 L430 240 L414 278 L226 278 L210 240 Z"/>
<path d="M226 214 L414 214 L430 240 L414 278 L226 278 L210 240 Z" fill="url(#grillglow)" opacity=".14"/>
<line class="cy glow-pulse" x1="234" y1="232" x2="406" y2="232" stroke-width="2.2"/>
<line class="cy glow-pulse2" x1="228" y1="246" x2="412" y2="246" stroke-width="1.6"/>
<line class="cy glow-pulse" x1="234" y1="260" x2="406" y2="260" stroke-width="1.6"/>
<circle class="nd blink" cx="320" cy="246" r="3.4"/>
</g>
<!-- alt tampon hava girisleri -->
<path class="ln2" d="M172 296 L218 296 L210 318 L164 318 Z" stroke-opacity=".5"/>
<path class="ln2" d="M468 296 L422 296 L430 318 L476 318 Z" stroke-opacity=".5"/>
<path class="cy" d="M180 304 L208 304 M468 304 L440 304" stroke-opacity=".45"/>
<!-- alt koruma / skid plate -->
<path class="ln2" d="M226 320 H414" stroke-opacity=".4"/>
<!-- tekerlek ipucu -->
<circle class="ln" cx="164" cy="340" r="34"/><circle class="ln2" cx="164" cy="340" r="24"/><circle class="ln2" cx="164" cy="340" r="6"/>
<circle class="ln" cx="476" cy="340" r="34"/><circle class="ln2" cx="476" cy="340" r="24"/><circle class="ln2" cx="476" cy="340" r="6"/>
</g>
<!-- boyut cizgileri -->
<line class="dim" x1="128" y1="92" x2="512" y2="92"/><rect x="124.5" y="320" width="7" height="7" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1"/><rect x="508.5" y="320" width="7" height="7" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1"/>
<path class="dim" d="M226 400 H414 M226 392 V408 M414 392 V408"/>
<path class="dim" d="M128 372 H512 M128 364 V380 M512 364 V380"/>
<g><ellipse class="cy" cx="320" cy="246" rx="194" ry="14" stroke-opacity=".2" stroke-dasharray="5 5"/><line class="dim" x1="126" y1="246" x2="514" y2="246"/><text x="454" y="242" fill="rgba(255,255,255,.45)" font-size="10" font-family="monospace" letter-spacing="1">EV-01</text></g>
<circle class="nd blink" cx="320" cy="106" r="2.8"/><circle class="nd blink" cx="128" cy="322" r="2.8"/><circle class="nd blink" cx="512" cy="322" r="2.8"/><circle class="nd blink" cx="320" cy="350" r="2.8"/>
<g class="scan"><line x1="70" y1="80" x2="570" y2="80" stroke="#00c8f0" stroke-opacity=".5" stroke-width="1"/></g>
</svg>
