<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img">
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
</pattern>
<radialGradient id="glow" cx="50%" cy="45%" r="60%">
<stop offset="0%" stop-color="#3b82f6" stop-opacity=".18"/>
<stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
</radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#3b82f6" stop-opacity=".55"/>
<stop offset="100%" stop-color="#3b82f6" stop-opacity=".08"/>
</linearGradient>
</defs>
<style>
.ln{fill:none;stroke:#3b82f6;stroke-opacity:.75;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.ln2{fill:none;stroke:#3b82f6;stroke-opacity:.32;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
.cy{fill:none;stroke:#00c8f0;stroke-opacity:.7;stroke-width:1.2;stroke-linecap:round}
.fl{fill:#3b82f6;fill-opacity:.06}
.nd{fill:#3b82f6}
.dim{fill:none;stroke:rgba(255,255,255,.28);stroke-width:.8;stroke-dasharray:3 4}
.blink{animation:bk 3.2s ease-in-out infinite}
.blink:nth-of-type(2n){animation-delay:.5s}
.blink:nth-of-type(3n){animation-delay:1.1s}
.blink:nth-of-type(5n){animation-delay:1.7s}
@keyframes bk{0%,100%{opacity:.2}50%{opacity:1}}
.draw{stroke-dasharray:6 8;animation:dr 5s linear infinite}
@keyframes dr{to{stroke-dashoffset:-56}}
.scan{animation:sc 7s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sc{0%{opacity:0;transform:translateY(-40px)}12%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateY(400px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 24s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:sp 24s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.float{animation:fo 9s ease-in-out infinite}
@keyframes fo{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.slide{animation:sl 8s cubic-bezier(.55,0,.45,1) infinite}
@keyframes sl{0%,6%{transform:translateX(0)}94%,100%{transform:translateX(var(--d,480px))}}
.comb{animation:cb 6s ease-in-out infinite}
@keyframes cb{0%,100%{opacity:.45}50%{opacity:.95}}
</style>
<rect width="640" height="420" fill="url(#g)"/>
<rect width="640" height="420" fill="url(#glow)"/>
<g class="float">
<path class="fl" d="M150 300 C150 300 140 240 148 190 C152 160 168 140 176 118 C182 100 180 84 176 70 L204 70 C200 84 198 100 204 118 C212 140 228 160 232 190 C240 240 230 300 230 300 Z"/><path class="ln" d="M150 300 C150 300 140 240 148 190 C152 160 168 140 176 118 C182 100 180 84 176 70 L204 70 C200 84 198 100 204 118 C212 140 228 160 232 190 C240 240 230 300 230 300 Z"/>
<path class="ln2" d="M154 140 Q190 136 226 140" stroke-opacity=".22"/><path class="ln2" d="M154 160 Q190 156 226 160" stroke-opacity=".22"/><path class="ln2" d="M154 180 Q190 176 226 180" stroke-opacity=".22"/><path class="ln2" d="M154 200 Q190 196 226 200" stroke-opacity=".22"/><path class="ln2" d="M154 220 Q190 216 226 220" stroke-opacity=".22"/><path class="ln2" d="M154 240 Q190 236 226 240" stroke-opacity=".22"/><path class="ln2" d="M154 260 Q190 256 226 260" stroke-opacity=".22"/><path class="ln2" d="M154 280 Q190 276 226 280" stroke-opacity=".22"/><rect class="ln2" x="172" y="66" width="36" height="10" rx="3" fill="none" stroke-opacity=".6"/>
</g>
<path class="ln" d="M120 340 H320 V390 H120 Z" fill="none"/><line class="cy draw" x1="120" y1="365" x2="320" y2="365" stroke-opacity=".7"/><path class="ln2" d="M210 340 L230 340 L220 318 Z" fill="none" stroke-opacity=".6"/>
<circle class="nd blink" cx="150" cy="365" r="2.4"/><circle class="nd blink" cx="290" cy="365" r="2.4"/><rect class="fl" x="360" y="90" width="240" height="190" rx="8"/><rect class="ln" x="360" y="90" width="240" height="190" rx="8" fill="none"/>
<line class="ln2" x1="360" y1="280" x2="480" y2="220" stroke-opacity=".18"/><line class="ln2" x1="390" y1="280" x2="480" y2="220" stroke-opacity=".18"/><line class="ln2" x1="420" y1="280" x2="480" y2="220" stroke-opacity=".18"/><line class="ln2" x1="450" y1="280" x2="480" y2="220" stroke-opacity=".18"/><line class="ln2" x1="480" y1="280" x2="480" y2="220" stroke-opacity=".18"/><line class="ln2" x1="510" y1="280" x2="480" y2="220" stroke-opacity=".18"/><line class="ln2" x1="540" y1="280" x2="480" y2="220" stroke-opacity=".18"/><line class="ln2" x1="570" y1="280" x2="480" y2="220" stroke-opacity=".18"/><line class="ln2" x1="600" y1="280" x2="480" y2="220" stroke-opacity=".18"/><circle class="cy" cx="420" cy="130" r="9" stroke-opacity=".8"/><line class="cy" x1="420" y1="117" x2="420" y2="111" stroke-opacity=".5"/><line class="cy" x1="429.2" y1="120.8" x2="433.4" y2="116.6" stroke-opacity=".5"/><line class="cy" x1="433" y1="130" x2="439" y2="130" stroke-opacity=".5"/><line class="cy" x1="429.2" y1="139.2" x2="433.4" y2="143.4" stroke-opacity=".5"/><line class="cy" x1="420" y1="143" x2="420" y2="149" stroke-opacity=".5"/><circle class="ln" cx="530" cy="220" r="40"/><ellipse class="ln2" cx="530" cy="220" rx="20" ry="40" stroke-opacity=".45"/><ellipse class="ln2" cx="530" cy="220" rx="-20" ry="40" stroke-opacity=".45"/><ellipse class="ln2" cx="530" cy="268" rx="46" ry="10" stroke-opacity=".3"/>
<text x="366" y="272" fill="rgba(255,255,255,.4)" font-size="9" font-family="monospace" letter-spacing="1.5">RENDER 01</text>
<path class="dim" d="M96 76 V300 M96 70 H116 M96 300 H116"/>
