<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img">
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
</pattern>
<radialGradient id="glow" cx="50%" cy="45%" r="60%">
<stop offset="0%" stop-color="#22c55e" stop-opacity=".18"/>
<stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
</radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#22c55e" stop-opacity=".55"/>
<stop offset="100%" stop-color="#22c55e" stop-opacity=".08"/>
</linearGradient>
