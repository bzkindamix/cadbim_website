<style>
.ln{fill:none;stroke:#fbbf24;stroke-opacity:.75;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.ln2{fill:none;stroke:#fbbf24;stroke-opacity:.32;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
